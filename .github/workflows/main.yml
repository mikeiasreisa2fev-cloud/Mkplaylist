name: Update Playlist
on:
  schedule:
    - cron: '0 */6 * * *' # Roda automaticamente a cada 6 horas
  workflow_dispatch: # Permite que você rode manualmente quando quiser
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run script
        run: python update_list.py
        
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.m3u epg.xml
          git commit -m "Update playlist and EPG" || exit 0
          git push
